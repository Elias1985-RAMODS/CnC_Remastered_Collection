name: Build RedAlert DLL

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build RedAlert.dll
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Sort-Object Name -Descending | Select-Object -First 1).Name
          $toolset = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\MSBuild\Microsoft\VC\v*\Platforms\x64\PlatformToolsets\*" -Directory | Sort-Object Name -Descending | Select-Object -First 1).Name
          $proj = Get-Content "REDALERT/RedAlert.vcxproj" -Raw
          if ($proj -match '<Platform>(Win64|x64|Win32)</Platform>') { $plat = $matches } else { $plat = "x64" }
          $env:CL = "/DWINDOWS_IGNORE_PACKING_MISMATCH /permissive /WX-"
          echo "Using SDK: $sdk | Toolset: $toolset | Platform: $plat"
          msbuild REDALERT/RedAlert.vcxproj /p:Configuration=Release /p:Platform=$plat /p:WindowsTargetPlatformVersion=$sdk /p:PlatformToolset=$toolset /p:TreatWarningAsError=false

      - name: Upload RedAlert.dll
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert-DLL
          path: "**/Release/RedAlert.dll"

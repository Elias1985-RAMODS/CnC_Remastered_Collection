name: Build RedAlert DLL

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build RedAlert.dll
        run: msbuild CnCRemastered.sln /t:RedAlert /p:Configuration=Release /p:Platform=x64

      - name: Upload RedAlert.dll
        uses: actions/upload-artifact@v4
        with:
          name: RedAlert-DLL
          path: "**/Release/RedAlert.dll"
